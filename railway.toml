[build]
builder = "NIXPACKS"
# The Nixpacks install phase is defined in nixpacks.toml so build tooling is
# included even when the service runs with NODE_ENV=production.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
