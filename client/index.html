<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Ops Workspace</title>
    <meta
      name="description"
      content="Print Ops — shop-floor workspace and secure order details form. Collects delivery details only — no payment is taken here."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta property="og:title" content="Print Ops" />
    <meta
      property="og:description"
      content="Shop-floor print operations and a secure buyer order form. The form collects delivery details only — no payment is taken here."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./brand/studio-hero.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("print-ops-theme");
          if (theme === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
