<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Ops Workspace</title>
    <meta
      name="description"
      content="Secure order details form for your print order. Collects delivery details only — no payment is taken here."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Order form" />
    <meta
      property="og:description"
      content="Confirm your print order details for the seller. This form does not take payment."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#171717" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("print-ops-theme-shop");
          var isLight = theme === "light";
          document.documentElement.classList.toggle("dark", !isLight);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isLight ? "#FAFAFA" : "#171717");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
